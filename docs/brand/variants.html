<!doctype html><meta charset="utf-8"><title>mark variants — stack</title>
<style>
body{margin:0;background:#000;color:#fff;font:12px/1.4 ui-monospace,Menlo,monospace}
.row{display:flex;gap:24px;padding:16px 24px;align-items:center;border-bottom:1px solid #222}
.row h2{width:60px;margin:0;font-size:14px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.pad{display:flex;align-items:center;justify-content:center;background:#000;color:#fff}
.inv{background:#fff;color:#000}
svg{display:block}
#lockup{padding:32px;display:flex;align-items:center;gap:20px;font-family:Geist,"Geist Sans",ui-sans-serif,system-ui;font-weight:500;font-size:64px;letter-spacing:-.01em;width:512px;box-sizing:border-box;justify-content:center}
#lockup .ai{font-family:"Geist Mono",ui-monospace,Menlo,monospace;font-weight:400;opacity:.6}
</style>
<script>
// Pilha isométrica: 3 planos quadrados (losangos 30°), topo sólido, dois de baixo em contorno.
const V={
 A:{off:5.5,w:10,sw:1.5,edges:false},
 B:{off:4.5,w:11,sw:1.25,edges:false},
 C:{off:5.5,w:10,sw:1.5,edges:true},
};
const plane=(cx,cy,w,h)=>`M ${cx} ${cy-h} L ${cx+w} ${cy} L ${cx} ${cy+h} L ${cx-w} ${cy} Z`;
function svg(v,s){
  const g=V[v],cx=16,w=g.w,h=w/2,cys=[16-g.off,16,16+g.off];
  let inner='';
  inner+=`<path d="${plane(cx,cys[2],w,h)}" stroke="currentColor" stroke-width="${g.sw}" stroke-linejoin="round" fill="none"/>`;
  inner+=`<path d="${plane(cx,cys[1],w,h)}" stroke="currentColor" stroke-width="${g.sw}" stroke-linejoin="round" fill="none"/>`;
  if(g.edges){const t=cys[0],m=cys[1];inner+=`<path d="M ${cx-w} ${t} V ${m} M ${cx} ${t+h} V ${m+h} M ${cx+w} ${t} V ${m}" stroke="currentColor" stroke-width="${g.sw}" stroke-linecap="round" fill="none"/>`}
  inner+=`<path d="${plane(cx,cys[0],w,h)}" fill="currentColor"/>`;
  return `<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none">${inner}</svg>`;
}
addEventListener('DOMContentLoaded',()=>{let h='';for(const v of Object.keys(V)){h+=`<div class="row"><h2>${v}</h2>`;for(const inv of [false,true])for(const s of [16,32,128])h+=`<div class="cell"><div class="pad ${inv?'inv':''}" style="width:${Math.max(s+16,48)}px;height:${Math.max(s+16,48)}px">${svg(v,s)}</div><span>${s}</span></div>`;h+=`</div>`}
h+=`<div id="lockup">${svg('A',64)}<span>mateusfb<span class="ai">.ai</span></span></div>`;document.body.innerHTML=h});
</script>
